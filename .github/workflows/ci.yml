name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore StoreOps.sln
      - name: Format check (lint)
        run: dotnet format StoreOps.sln --verify-no-changes --no-restore
      - name: Build (warnings as errors, analyzers on)
        run: dotnet build StoreOps.sln --no-restore -c Release
      - name: Test
        run: dotnet test StoreOps.sln --no-build -c Release --logger trx
